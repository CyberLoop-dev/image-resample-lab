<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Image Resampling Lab</title><link rel="stylesheet" href="/styles.css"></head><body><main><header class="hero"><div><div class="eyebrow">IMAGE RESAMPLE LAB</div><h1>Image Resampling Lab</h1><p>A local image playground comparing nearest-neighbor and browser smoothing modes at adjustable output sizes.</p></div><img class="mark" src="/assets/mark.svg" alt=""></header><section class="panel"><div class="field"><label for="file">Choose a local image</label><input id="file" type="file" accept="image/*"></div><div class="grid"><div class="field"><label for="scale">Scale: <span id="scaleValue">50%</span></label><input id="scale" type="range" min="10" max="200" value="50"></div><div class="field"><label for="mode">Resampling mode</label><select id="mode"><option value="nearest">Nearest neighbor</option><option value="low">Smoothing · low</option><option value="medium">Smoothing · medium</option><option value="high" selected>Smoothing · high</option></select></div></div><div class="controls"><button id="render" class="primary" disabled>Resample image</button></div><p class="muted" id="meta">Choose an image to begin.</p></section><section class="grid"><div class="panel"><h2>Original</h2><canvas id="source" width="320" height="220"></canvas></div><div class="panel"><h2>Resampled</h2><canvas id="output" width="320" height="220"></canvas></div></section><footer>Local-first learning tool · No account · No uploads</footer></main><script type="module" src="/app.js"></script></body></html>
